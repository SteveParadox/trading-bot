name: FX Python validation
on:
  pull_request:
  push:
    branches: [main, codex/ai-market-snapshot]
permissions:
  contents: read
jobs:
  fx-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-fx-research.txt -r requirements-fx-ml.txt
      - run: python -m compileall -q fxbot
      - run: python -m pytest -q tests/test_fx*.py
